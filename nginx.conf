user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;

  server {
    listen 80;
    root /app/frontend;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
